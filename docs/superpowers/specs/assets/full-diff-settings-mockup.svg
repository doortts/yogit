<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: Menlo, Monaco, Consolas, monospace; }
      .title { fill: #eef2f8; font-size: 22px; font-weight: 700; }
      .body { fill: #d4dae5; font-size: 15px; }
      .small { fill: #909bad; font-size: 13px; }
      .label { fill: #929daf; font-size: 12px; font-weight: 650; letter-spacing: .05em; }
    </style>
  </defs>
  <rect width="1120" height="640" rx="12" fill="#12161d"/>
  <rect width="1120" height="44" rx="12" fill="#1b2029"/>
  <circle cx="20" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="22" r="5" fill="#febc2e"/>
  <circle cx="56" cy="22" r="5" fill="#28c840"/>
  <text x="80" y="28" class="ui body" font-size="13" font-weight="650">Yogit Settings</text>

  <rect x="0" y="44" width="238" height="596" fill="#151a22"/>
  <text x="22" y="82" class="ui label">SETTINGS</text>
  <text x="26" y="120" class="ui body">General</text>
  <rect x="12" y="140" width="214" height="42" rx="6" fill="#263954"/>
  <rect x="12" y="140" width="3" height="42" rx="1.5" fill="#55a7ff"/>
  <text x="26" y="166" class="ui body" fill="#eef5ff" font-weight="650">Full Diff</text>
  <text x="26" y="210" class="ui body">Git integrations</text>
  <line x1="238" y1="44" x2="238" y2="640" stroke="#303744"/>

  <text x="278" y="91" class="ui title">Full Diff</text>
  <text x="278" y="119" class="ui small">새 Full Diff 화면의 초기 보기와 코드 표시 방식을 정합니다.</text>

  <rect x="278" y="152" width="800" height="206" rx="9" fill="#181e27" stroke="#343d4b"/>
  <text x="302" y="183" class="ui label">INITIAL VIEW</text>

  <circle cx="316" cy="223" r="9" fill="#2d6fbd" stroke="#6fb5ff" stroke-width="2"/>
  <circle cx="316" cy="223" r="3.5" fill="#eef6ff"/>
  <text x="340" y="219" class="ui body" font-weight="650">Hunk blocks</text>
  <text x="340" y="243" class="ui small">변경된 블록만 모아 보여줍니다. 코드 리뷰에 권장합니다.</text>
  <rect x="950" y="202" width="90" height="27" rx="5" fill="#24334a"/>
  <text x="967" y="221" class="mono small" fill="#9fcaff">default</text>

  <circle cx="316" cy="290" r="9" fill="#181e27" stroke="#657184" stroke-width="2"/>
  <text x="340" y="286" class="ui body" font-weight="650">Full file focused on first change</text>
  <text x="340" y="310" class="ui small">파일 전체를 열고 첫 번째 변경 위치로 이동합니다.</text>

  <line x1="302" y1="333" x2="1054" y2="333" stroke="#303744"/>
  <text x="302" y="349" class="ui small">열려 있는 화면은 바꾸지 않으며 다음에 여는 화면부터 적용합니다.</text>

  <rect x="278" y="378" width="800" height="152" rx="9" fill="#181e27" stroke="#343d4b"/>
  <text x="302" y="409" class="ui label">KEYBOARD</text>
  <text x="302" y="444" class="ui body">페이지 스크롤</text>
  <text x="302" y="468" class="ui small">타임라인 미리보기와 Full Diff에서 같은 단축키와 이동량을 사용합니다.</text>
  <rect x="848" y="427" width="190" height="34" rx="6" fill="#202936" stroke="#405069"/>
  <text x="870" y="449" class="mono body" fill="#b9d8ff">⌘⇧↑  /  ⌘⇧↓</text>
  <text x="940" y="490" class="mono small" fill="#8796ab">48 px</text>

  <text x="278" y="579" class="ui small">UI labels</text>
  <text x="345" y="579" class="ui small" fill="#d6dce6">System UI</text>
  <text x="474" y="579" class="mono small">path · hash · shortcut · source</text>
  <text x="812" y="579" class="mono small" fill="#d6dce6">Menlo</text>
  <text x="875" y="579" class="ui small">/ 한국어 고정폭</text>
  <text x="980" y="579" font-family="D2Coding, Menlo, monospace" font-size="12" fill="#d6dce6">D2Coding</text>
</svg>
